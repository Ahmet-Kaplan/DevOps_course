# =============================================================================
# CI - test branch: build the production images and test the REAL stack
# -----------------------------------------------------------------------------
# Branch flow:  dev --(PR)--> test --(PR)--> main (production)
#
# The second quality gate answers "do the containers work TOGETHER?":
#   1. build the "production" Dockerfile targets (the exact images we ship);
#   2. start them with the REAL docker-compose.prod.yml through the REAL
#      deploy/deploy.sh (same networks, limits, read-only filesystems,
#      healthchecks and nginx proxy container as on the server);
#   3. HTTP mode (stages 1-2 on the server: no certificate yet): run
#      tests/integration/api.test.mjs against http://localhost, i.e. through
#      the proxy -> frontend/backend -> Postgres, the full request path;
#   4. HTTPS mode (stage 3+): put a self-signed certificate where certbot would
#      put the real one, restart the proxy, and run the same tests against
#      https://localhost - redirect, TLS, HTTP/2 and HSTS included;
#   5. always tear everything down.
# Nothing is pushed to Docker Hub from here - that is ci-main's job.
# =============================================================================
name: CI (test)

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every compose call needs the file AND the variables to even parse it -
# including `ps`, `logs` and `down`. One definition, used by every step.
env:
  COMPOSE: docker compose -f docker-compose.prod.yml --env-file .env.prod

jobs:
  integration:
    name: Build images & run integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js 24 (runs the zero-dependency test file)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Buildx = the BuildKit-based builder. We use it for the GitHub Actions
      # layer cache (type=gha): unchanged layers (e.g. `npm ci` when the
      # lockfile did not change) are restored instead of rebuilt.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Image names follow the contract: ${DOCKER_HUB_USERNAME}/bugsquash-*:${IMAGE_TAG}
      # With DOCKER_HUB_USERNAME=local and IMAGE_TAG=ci, the prod compose file
      # resolves to exactly these local tags - no registry involved.
      # `load: true` copies the built image into the runner's Docker daemon.
      - name: Build backend image (production target)
        uses: docker/build-push-action@v7
        with:
          context: app/backend
          target: production
          tags: local/bugsquash-backend:ci
          load: true
          push: false
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=ci-test-backend
          cache-to: type=gha,mode=max,scope=ci-test-backend

      - name: Build frontend image (production target)
        uses: docker/build-push-action@v7
        with:
          context: app/frontend
          target: production
          tags: local/bugsquash-frontend:ci
          load: true
          push: false
          build-args: |
            VITE_APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=ci-test-frontend
          cache-to: type=gha,mode=max,scope=ci-test-frontend

      # Security sanity check: a container running as root turns any app RCE
      # into root inside the container (and one kernel bug away from the host).
      # Both of OUR Dockerfiles promise a non-root USER; make the promise
      # testable. The proxy (official nginx image) is deliberately NOT in this
      # list: its MASTER process runs as root to read the root-only Let's
      # Encrypt keys, while its workers - the processes that handle requests -
      # run as "nginx". That is checked separately once the stack runs.
      - name: Verify our images do not run as root
        run: |
          for image in local/bugsquash-backend:ci local/bugsquash-frontend:ci; do
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            echo "$image runs as user: '${user:-<unset = root>}'"
            case "$user" in
              "" | root | 0 | 0:* | root:*)
                echo "::error::$image runs as root - add a non-root USER to its Dockerfile"
                exit 1
                ;;
            esac
          done

      # A throwaway .env.prod (git-ignored), shaped like the one on the server.
      # Fresh random secrets on every run: even throwaway credentials should
      # never be hard-coded in a public workflow file.
      #   DOMAIN=localhost      the proxy's server name; also used for the
      #                         self-signed certificate in the HTTPS part
      #   COOKIE_SECURE=false   HTTP first, like stages 1-2 on the server
      - name: Write throwaway .env.prod
        run: |
          {
            echo "DOCKER_HUB_USERNAME=local"
            echo "IMAGE_TAG=ci"
            echo "DOMAIN=localhost"
            echo "COOKIE_SECURE=false"
            echo "POSTGRES_DB=bugsquash"
            echo "POSTGRES_USER=bugsquash"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > .env.prod
          chmod 600 .env.prod

      # SKIP_PULL=1 below never pulls, so our freshly built local/* images are
      # the ones that run. The public images in the compose file (nginx,
      # postgres) still have to come from Docker Hub once: a fresh runner has
      # none of them. `config --images` lists exactly the pinned tags.
      - name: Pull the public images (nginx, postgres)
        run: $COMPOSE config --images | grep -v '^local/' | xargs -r -n1 docker pull --quiet

      # The REAL deploy script, in rehearsal mode: SKIP_PULL=1 uses the images
      # built above instead of pulling from Docker Hub. It runs `up -d --wait`
      # (every healthcheck must pass), reloads the proxy config and smoke-tests
      # each hop - exactly what happens on the server.
      - name: Deploy with deploy/deploy.sh (HTTP-only mode)
        run: SKIP_PULL=1 ./deploy/deploy.sh ci

      # Only the proxy may publish ports; the app containers must stay private.
      # In `ps`, a PUBLISHED port looks like "0.0.0.0:80->80/tcp"; a port that
      # is only reachable inside Docker's networks shows as "3000/tcp".
      - name: Check published ports and nginx worker user
        run: |
          $COMPOSE ps --format 'table {{.Service}}\t{{.Status}}\t{{.Ports}}'
          published="$($COMPOSE ps --format '{{.Service}}: {{.Ports}}' | grep -v '^proxy:' | grep -e '->' || true)"
          if [ -n "$published" ]; then
            echo "::error::only the proxy may publish ports, found: $published"
            exit 1
          fi
          # Every process except the master must run as the "nginx" user.
          $COMPOSE exec -T proxy ps -o user,args
          if $COMPOSE exec -T proxy ps -o user,args | grep 'nginx: worker' | grep -qv '^nginx '; then
            echo "::error::an nginx worker process runs as root"
            exit 1
          fi

      - name: Integration tests over HTTP (through the proxy)
        env:
          BASE_URL: http://localhost
        run: node --test tests/integration/api.test.mjs

      # Stage 1 on the server: the browser sends the bare IP as Host header.
      - name: Smoke-test HTTP-only edge (IP access, /healthz, ACME path)
        run: |
          curl --fail --silent --show-error http://127.0.0.1/healthz; echo
          curl --fail --silent --show-error http://127.0.0.1/api/health; echo
          curl --fail --silent --show-error --output /dev/null --write-out 'GET http://127.0.0.1/ -> %{http_code}\n' http://127.0.0.1/
          # An unknown challenge token is a 404 from the proxy, never the app.
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/.well-known/acme-challenge/missing)"
          [ "$code" = "404" ] || { echo "::error::ACME path answered $code instead of 404"; exit 1; }

      # ---- HTTPS mode ---------------------------------------------------------
      # certbot would write live/<DOMAIN>/fullchain.pem + privkey.pem into the
      # "letsencrypt" volume. We put a self-signed certificate at that exact
      # path (through a throwaway container, because the volume belongs to
      # Docker), then restart the proxy: at start it finds the certificate and
      # renders the HTTPS config - the same switch as in stage 3.
      - name: Switch the proxy to HTTPS with a self-signed certificate
        run: |
          cert_dir="$RUNNER_TEMP/cert"
          mkdir -p "$cert_dir"
          openssl req -x509 -nodes -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -days 2 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" \
            -keyout "$cert_dir/privkey.pem" -out "$cert_dir/fullchain.pem"
          # install -D = create the target directory; -m 600 = root-only, like
          # certbot's own key files; -t = into this directory.
          $COMPOSE run --rm --no-deps -T -v "$cert_dir:/src:ro" --entrypoint install certbot \
            -D -m 600 -t /etc/letsencrypt/live/localhost /src/fullchain.pem /src/privkey.pem
          # The certbot service itself works (pinned image, read-only rootfs + tmpfs):
          $COMPOSE run --rm --no-deps -T certbot --version
          $COMPOSE restart proxy
          # `restart` returns as soon as the container is STARTED; wait for its
          # healthcheck (nothing is recreated - the configuration did not change).
          $COMPOSE up -d --no-deps --wait --wait-timeout 60 proxy
          $COMPOSE logs --no-color proxy | grep 'certificate found'
          # Stage 3: HTTPS works -> the login cookie gets the Secure flag again.
          sed -i 's/^COOKIE_SECURE=.*/COOKIE_SECURE=true/' .env.prod

      # Again the real script: it recreates the backend (COOKIE_SECURE changed),
      # detects HTTPS mode and checks the redirect and the TLS path.
      - name: Deploy with deploy/deploy.sh (HTTPS mode)
        run: SKIP_PULL=1 ./deploy/deploy.sh ci

      - name: Smoke-test HTTPS edge (redirect, HTTP/2, HSTS)
        run: |
          # Port 80: everything but ACME and /healthz is a 301 to https://DOMAIN.
          curl --silent --output /dev/null --write-out 'http://localhost/login.html -> %{http_code} %{redirect_url}\n' http://localhost/login.html
          [ "$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' http://localhost/login.html)" = "301 https://localhost/login.html" ]
          curl --fail --silent --show-error http://127.0.0.1/healthz; echo
          # Port 443: HTTP/2 + HSTS (--insecure: the certificate is self-signed).
          headers="$(curl --fail --silent --show-error --insecure --http2 --head https://localhost/)"
          echo "$headers"
          echo "$headers" | grep -q '^HTTP/2 200'
          echo "$headers" | grep -qi '^strict-transport-security: max-age='

      - name: Integration tests over HTTPS (through the proxy)
        env:
          BASE_URL: https://localhost
          # Node's fetch() must accept the self-signed certificate. ONLY ever
          # do this against a throwaway test stack.
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: node --test tests/integration/api.test.mjs

      # Only runs when an earlier step failed: the logs are what you need to
      # debug a red build (crash on startup, failed healthcheck, nginx error).
      - name: Dump container state and logs
        if: failure()
        run: |
          $COMPOSE ps -a || true
          $COMPOSE logs --no-color --timestamps || true

      # `always()` = run even if the tests failed or the job was cancelled.
      # -v also removes the volumes (database, certificate): every run starts
      # from scratch. NEVER run `down -v` on the server.
      - name: Tear down
        if: always()
        run: |
          if [ -f .env.prod ]; then
            $COMPOSE down -v --remove-orphans
            rm -f .env.prod
          fi
