# =============================================================================
# ansible/ansible.cfg - project-wide Ansible settings
# -----------------------------------------------------------------------------
# Ansible reads the FIRST config file it finds, in this order:
#   1. the file named in $ANSIBLE_CONFIG
#   2. ./ansible.cfg            <- THIS file, when you run Ansible from ansible/
#   3. ~/.ansible.cfg
#   4. /etc/ansible/ansible.cfg
# Settings are NOT merged across files. That is why ./provision.sh always runs
# from this directory: then everybody (you, a teammate, CI) gets the same
# behaviour, whatever is in their personal ~/.ansible.cfg.
#
# Security note: Ansible IGNORES ./ansible.cfg in a world-writable directory
# (anyone could plant one there). Keep the repository checkout private.
#
# List every effective setting and where it came from:
#     ansible-config dump --only-changed
# =============================================================================

[defaults]
# Where the servers are listed. inventory.ini is git-ignored (it holds YOUR
# server's IP and login name); copy inventory.example.ini to create it.
# ./provision.sh user@host skips this file and builds an inline inventory.
inventory = inventory.ini

# Where `roles:` entries in a playbook are looked up.
roles_path = roles

# Ansible runs its modules with Python ON THE SERVER. "auto_silent" = find the
# right interpreter automatically (Debian 13: /usr/bin/python3) and do not
# print a warning about it on every run.
interpreter_python = auto_silent

# Print task results as readable YAML instead of one long JSON line.
callback_result_format = yaml

# "*.retry" files list the hosts that failed; with one server they are clutter.
retry_files_enabled = False

# NOTE: there is deliberately NO "vault_password_file = .vault_pass" here.
# Ansible would refuse to start whenever that file is missing - e.g. in CI or
# on a fresh clone. ./provision.sh sets ANSIBLE_VAULT_PASSWORD_FILE=.vault_pass
# only when the file exists (created by ./bootstrap-secrets.sh).

[ssh_connection]
# Pipelining sends each module to the server's Python over the already-open SSH
# channel instead of copying a temporary file first: fewer round trips, much
# faster runs. Requires that sudo does not demand a TTY ("requiretty"), which is
# the Debian default.
pipelining = True

# Options passed to every `ssh` call Ansible makes (this REPLACES Ansible's
# default ssh_args, so the multiplexing options are repeated here):
#
#   ControlMaster=auto / ControlPersist=60s
#       The first task opens ONE SSH connection; every later task reuses it
#       (multiplexing) instead of doing a new TCP + crypto handshake. The master
#       connection stays open 60 s after the last task.
#
#   StrictHostKeyChecking=accept-new
#       "Trust on first use" (TOFU): the FIRST time we see a host, its key is
#       saved to ~/.ssh/known_hosts without asking - otherwise a fresh VM would
#       stop the run at an interactive "Are you sure (yes/no)?" prompt. If a
#       KNOWN host later presents a DIFFERENT key, ssh still refuses to connect
#       (possible man-in-the-middle). After you recreate the VM it legitimately
#       has a new key: run ./provision.sh --new-vm, which forgets the old key.
#       (Stronger than TOFU: compare the fingerprint with the host key Google
#       publishes as a guest attribute - docs/gcp-vm-reference.md, section 4.)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
