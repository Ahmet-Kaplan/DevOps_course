# =============================================================================
# ansible/inventory.example.ini - template for YOUR inventory
# -----------------------------------------------------------------------------
# The inventory answers "WHICH machines does Ansible manage, and how does it
# log in?". Create your own copy (it is git-ignored, like .env files):
#
#     cp ansible/inventory.example.ini ansible/inventory.ini
#     nano ansible/inventory.ini          # your VM's external IP + your login
#
# Then:  ./ansible/provision.sh           (uses inventory.ini)
# Or skip the file completely:
#        ./ansible/provision.sh your-user@203.0.113.10
#
# Format: one host per line, "alias  key=value ...". Lines in [brackets] are
# GROUPS. The playbooks target "all" hosts, so the group name is only for you.
#
#   ansible_host  the address to SSH to. Use the VM's STATIC external IP
#                 (deploy/gcp-vm-setup.md step 2): it survives deleting and
#                 recreating the VM, so this file never changes.
#   ansible_user  your ADMIN login on the VM - the account with passwordless
#                 sudo that gcloud / the guest agent created for your SSH key
#                 (NOT "deploy": Ansible creates that account itself).
#   ansible_port  only if SSH does not listen on 22.
#
# 203.0.113.10 is from a range reserved for documentation (RFC 5737) - it is
# guaranteed not to be anybody's real server.
# =============================================================================

[servers]
devops ansible_host=203.0.113.10 ansible_user=your-user
