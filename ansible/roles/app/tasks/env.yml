---
# =============================================================================
# env.yml - render .env.prod (the app's private settings sheet)
# -----------------------------------------------------------------------------
# Settings from group_vars/all.yml, secrets from the vault, and ONE computed
# value: COOKIE_SECURE. It must be true with HTTPS and false without it
# (browsers drop a Secure cookie that arrives over http://), so Ansible sets
# it from the facts instead of trusting a hand-edited value:
#   certificate in the volume, or one will be restored from backup -> true
#   otherwise (stage 1/2 or DNS not ready yet)                      -> false
# roles/tls flips it to true the moment it obtains a certificate.
# =============================================================================

- name: Check the certificate volume
  ansible.builtin.import_tasks: cert_check.yml

- name: Look for a certificate backup on this laptop for {{ domain }}
  ansible.builtin.stat:
    path: "{{ backup_local_dir }}/letsencrypt-latest.tar.gz.vault"
  delegate_to: localhost
  become: false
  register: app_cert_backup

- name: Decide whether to restore the certificate backup
  ansible.builtin.set_fact:
    # Only with a domain: a certificate is always for one name (stage 2+).
    app_restore_certs: >-
      {{ app_restore_backups | bool and domain | length > 0
         and not app_cert_present and app_cert_backup.stat.exists }}

- name: Decide COOKIE_SECURE
  ansible.builtin.set_fact:
    app_cookie_secure: "{{ app_cert_present or app_restore_certs }}"

- name: Check that the secrets are safe to write into an env file
  # Hex/base64 characters only: no spaces, quotes, "$" or "#", which an env
  # file would interpret. bootstrap-secrets.sh only produces such values.
  ansible.builtin.assert:
    that:
      - vault_postgres_password is match('^[A-Za-z0-9._~+/=-]+$')
      - vault_jwt_secret is match('^[A-Za-z0-9._~+/=-]+$')
    fail_msg: >-
      vault_postgres_password / vault_jwt_secret contain characters that need
      quoting in .env.prod. Use values from `openssl rand -hex 32`
      (ansible-vault edit secrets/vault.yml).
    quiet: true
  no_log: true

- name: Write .env.prod (mode 0600) into {{ app_dir }}
  ansible.builtin.template:
    src: env.prod.j2
    dest: "{{ app_dir }}/.env.prod"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  # no_log: never print the secrets - not even in --diff output or on errors.
  no_log: true
  register: app_env_file

- name: Show what was decided
  ansible.builtin.debug:
    msg: >-
      .env.prod {{ 'updated' if app_env_file is changed else 'unchanged' }} -
      DOMAIN={{ domain }}, IMAGE_TAG={{ image_tag }}, COOKIE_SECURE={{ app_cookie_secure | bool | lower }}
      ({{ 'certificate present' if app_cert_present else ('certificate will be restored from backup'
      if app_restore_certs else 'no certificate yet - plain HTTP') }})
