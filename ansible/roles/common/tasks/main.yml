---
# =============================================================================
# roles/common/tasks/main.yml - base OS setup every server gets
# -----------------------------------------------------------------------------
# Every task DESCRIBES A STATE ("package X is installed", "line Y is in file
# Z"), not an action. Ansible compares that state with reality and only acts
# on a difference - so running the role twice changes nothing the second time
# (idempotency). Watch the PLAY RECAP: the second run should say changed=0.
# =============================================================================

- name: Refresh the apt package index (at most once per hour)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ common_apt_cache_valid_time }}"
  # Refreshing the index downloads metadata but changes no configuration.
  # Reporting it as "changed" would make every run look like it did something.
  changed_when: false

- name: Upgrade installed packages (only with common_apt_upgrade=true)
  ansible.builtin.apt:
    upgrade: safe
  when: common_apt_upgrade | bool

- name: Install the base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    # "present", not "latest": install if missing, otherwise leave the version
    # alone. "latest" would upgrade on every run - never idempotent.
    state: present

- name: Turn on daily package-list refresh and security updates
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/20auto-upgrades
    # regexp finds an existing line for this setting (whatever its value) and
    # replaces it; if there is none, the line is appended.
    regexp: '^\s*APT::Periodic::{{ item }}\s'
    line: 'APT::Periodic::{{ item }} "1";'
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - Update-Package-Lists
    - Unattended-Upgrade
  when: common_unattended_upgrades | bool

- name: Allow unattended-upgrades to reboot at night when an update needs it
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      // Managed by Ansible (roles/common) - local edits are overwritten.
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ common_unattended_reboot_time }}";
    owner: root
    group: root
    mode: "0644"
  when: common_unattended_upgrades | bool and common_unattended_reboot | bool

- name: Keep the apt timers that download and install updates enabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer           # refreshes the package lists
    - apt-daily-upgrade.timer   # runs unattended-upgrade
  when: common_unattended_upgrades | bool
