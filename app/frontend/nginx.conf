# =============================================================================
# nginx config for the frontend CONTAINER (not the edge "proxy" container,
# whose config lives in deploy/nginx/).
#
# Installed as /etc/nginx/conf.d/default.conf in the nginxinc/nginx-unprivileged
# image. That image's main /etc/nginx/nginx.conf includes conf.d/*.conf INSIDE
# its `http { }` block, so this file may contain http-level directives (gzip,
# map) followed by our `server { }`.
#
# Why nginx-unprivileged and not the regular nginx image?
#   * It runs as user 101 (nginx), never as root. Classically only root may
#     bind ports below 1024, so the image listens on 8080. (Docker 20.10+ sets
#     net.ipv4.ip_unprivileged_port_start=0 inside each container's network
#     namespace, but 8080 also works on rootless Podman, Kubernetes, etc.)
#   * It keeps its pid file and temp directories in /tmp. With Compose's
#     `read_only: true` + `tmpfs: /tmp`, the whole root filesystem is read-only
#     and /tmp is a small in-memory mount. Nothing here writes anywhere else:
#     logs go to /dev/stdout and /dev/stderr (symlinks provided by the image),
#     where `docker logs` collects them.
#
# Who talks to this server?
#   * Production and CI: the edge "proxy" container (deploy/nginx/, the only
#     service with published ports) terminates TLS and proxies "/" to
#     frontend:8080 over the Docker network "edge". It sends /api/ straight to
#     the backend, so the /api/ block below is a second path to the API.
#   * deploy/deploy.sh uses that path in its smoke tests
#     (docker compose exec frontend wget -qO- http://127.0.0.1:8080/api/health):
#     it proves this container can reach backend:3000 through Docker's DNS.
# =============================================================================

# Don't advertise the exact nginx version in headers and error pages.
server_tokens off;

# Compress text responses. HTML is always compressed when gzip is on; the other
# types must be listed. Already-compressed formats (png, woff2) are left alone.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/css text/plain application/javascript application/json image/svg+xml;

# Cache policy by URL, computed once here and applied with a single add_header
# in the server block (see the note about add_header inheritance there).
#   /assets/*  file names contain a content hash (index-3fa9c1.js). A new build
#              produces new names, so the old files can be cached "forever".
#   /api/*     empty value = nginx adds no header; the backend decides.
#   the rest   HTML pages, favicon: "no-cache" means "revalidate every time"
#              (cheap 304 thanks to ETag). That is what lets a new deploy show up
#              immediately: the new HTML points at the new hashed assets.
map $uri $bugsquash_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "";
    default     "no-cache";
}

# Preserve the original scheme if a proxy in front of us already set it (the
# edge proxy sends "https" from stage 3 on); otherwise use our own ($scheme = http).
map $http_x_forwarded_proto $bugsquash_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # IPv4 only, on purpose: the image's entrypoint would normally add
    # `listen [::]:8080`, but containers often have IPv6 disabled, and nginx
    # refuses to start if it cannot bind an address. (This port is not published
    # at all: only the edge proxy reaches it, over the IPv4 Docker network.)
    listen 8080;
    server_name _;

    root /usr/share/nginx/bugsquash;
    index index.html;
    charset utf-8;

    # Redirects issued by nginx itself (e.g. /foo -> /foo/) use a relative
    # Location header. Otherwise nginx would build an absolute URL with its own
    # port (http://devops.gulfheight.com:8080/...), which is wrong behind a proxy.
    absolute_redirect off;

    # ---------------------------------------------------------------- headers
    # GOTCHA: add_header directives are inherited from the server block ONLY by
    # locations that define no add_header of their own. That is why no location
    # below uses add_header: every response gets the same set from here.
    # `always` = also on error responses (404, 503...).
    add_header Cache-Control $bugsquash_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # The app loads nothing from other origins and uses no inline <script>, so
    # 'self' is enough. A CSP like this turns most XSS bugs into a console error.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # HSTS is deliberately NOT set here: TLS ends at the edge proxy, which owns it.

    # ---------------------------------------------------------------- health
    # Liveness probe for the Docker HEALTHCHECK, Compose and deploy.sh. It proves
    # nginx is up and serving without depending on the backend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---------------------------------------------------------------- API proxy
    location /api/ {
        # Docker's embedded DNS server. It answers for Compose service names
        # ("backend") on user-defined networks, from inside every container.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;

        # Why a variable instead of `proxy_pass http://backend:3000;`?
        # With a literal hostname, nginx resolves it ONCE at startup:
        #   - if "backend" doesn't exist yet, nginx refuses to start at all;
        #   - if the backend container is recreated (new deploy), it gets a new
        #     IP and nginx keeps sending traffic to the old, dead one.
        # With a variable, nginx resolves the name at request time through the
        # resolver above and caches the answer for `valid=10s`.
        # (With a variable and no URI part, the original /api/... path is passed through unchanged.)
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bugsquash_forwarded_proto;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # The API only accepts tiny JSON bodies (credentials, a score).
        client_max_body_size 16k;

        # If nginx itself can't reach the backend (DNS failure, connection
        # refused, timeout), answer in the API's own JSON error format instead of
        # nginx's HTML error page. Errors the backend *returns* (e.g. its own 503
        # from /api/health) pass through untouched, because proxy_intercept_errors
        # is off.
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"The API is unavailable right now. Try again in a moment."}';
    }

    # ---------------------------------------------------------------- static files
    # Hashed build output. A missing file is a real 404, never a fallback page.
    location /assets/ {
        try_files $uri =404;
    }

    # Multi-page routing: /login.html is a file; /login also works ($uri.html);
    # / falls through to $uri/ and the `index` directive (index.html).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
