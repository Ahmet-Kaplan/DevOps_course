# =============================================================================
# BOOTSTRAP (HTTP-only) host nginx config - use ONLY until the certificate exists
# -----------------------------------------------------------------------------
# The chicken-and-egg problem:
#   * The production config (deploy/nginx/conf.d/devops.gulfheight.com.conf)
#     points at /etc/letsencrypt/live/devops.gulfheight.com/fullchain.pem.
#   * On a fresh server that file does not exist yet, so `nginx -t` fails and
#     nginx refuses to (re)load.
#   * But to GET the certificate, Let's Encrypt must reach a running nginx on
#     port 80 (HTTP-01 challenge).
#
# Solution: start with this plain-HTTP config, obtain the certificate, then
# replace it with the full TLS config. Install it under the SAME file name the
# production config will use, so the swap later is a simple overwrite (both
# files define the same upstream names, so they must never be active together):
#
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/nginx/bootstrap/devops.gulfheight.com.http-only.conf \
#           /etc/nginx/conf.d/devops.gulfheight.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d devops.gulfheight.com
#
# `certbot --nginx` finds the server block below by its server_name, answers
# the challenge, and then edits this file to add TLS. Afterwards we overwrite
# it with the repo's full config. Full walkthrough: deploy/letsencrypt-setup.md
#
# Bonus: the app is already reachable at http://devops.gulfheight.com, which is
# a handy test that DNS, the VPC firewall rules and the containers work before
# TLS is involved.
# =============================================================================

upstream bugsquash_backend {
    server 127.0.0.1:3000;      # Express API container (published on loopback only)
    keepalive 16;
}

upstream bugsquash_frontend {
    server 127.0.0.1:8080;      # frontend nginx container (published on loopback only)
    keepalive 16;
}

# Empty Connection header for normal requests (= keep upstream connections
# alive), "upgrade" for WebSockets. Explained in the production config.
map $http_upgrade $bugsquash_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name devops.gulfheight.com;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/devops.gulfheight.com.access.log;
    error_log  /var/log/nginx/devops.gulfheight.com.error.log warn;

    # HTTP-01 challenge files for `certbot certonly --webroot -w /var/www/certbot`.
    # (`certbot --nginx` does not need it - it injects its own location - but
    # serving the webroot keeps both methods available.)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Same proxy headers as in production; defined once at server level so all
    # locations inherit them (a location with its own proxy_set_header would
    # inherit NONE of these). X-Forwarded-Proto is "http" here, which is the
    # truth: there is no TLS yet. With COOKIE_SECURE=true browsers refuse to
    # store a "Secure" cookie received over plain HTTP, so logging in only
    # works once TLS is set up. Browsing the landing page works already.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $bugsquash_connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # No trailing slash in proxy_pass => the URI is forwarded unchanged.
    location /api/ {
        proxy_pass http://bugsquash_backend;
    }

    location / {
        proxy_pass http://bugsquash_frontend;
    }
}
