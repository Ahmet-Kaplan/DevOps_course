# =============================================================================
# /etc/nginx/conf.d/devops.gulfheight.com.conf  -  HOST nginx, PRODUCTION (TLS)
# -----------------------------------------------------------------------------
# Installed on the Google Cloud VM (nginx from Debian's apt repo, NOT in Docker):
#
#   sudo cp deploy/nginx/conf.d/devops.gulfheight.com.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# PREREQUISITE: the Let's Encrypt certificate must already exist. This file
# references /etc/letsencrypt/live/devops.gulfheight.com/*.pem, and `nginx -t`
# fails if those files are missing. On a fresh server install the HTTP-only
# bootstrap config first (deploy/nginx/bootstrap/), get the certificate, then
# swap this file in. Step-by-step: deploy/letsencrypt-setup.md
#
# Role of this nginx = REVERSE PROXY at the edge of the server:
#
#   Internet --:443 TLS--> host nginx --+-- /api/ --> 127.0.0.1:3000  backend container
#                                       '-- /     --> 127.0.0.1:8080  frontend container
#
#   * It TERMINATES TLS: HTTPS ends here, the hop to the containers is plain HTTP
#     over the loopback interface, which never leaves the machine.
#   * The containers publish their ports on 127.0.0.1 ONLY, so this nginx is the
#     single door into the app. (Docker-published ports bypass host firewalls
#     such as ufw or nftables INPUT rules - see the ports: comments in
#     docker-compose.prod.yml.)
#   * /api/ goes straight to the backend instead of through the frontend
#     container's nginx: one hop less, and the frontend container can be
#     restarted without breaking the API.
#
# Debian's /etc/nginx/nginx.conf includes conf.d/*.conf INSIDE its `http { }`
# block, so everything in this file lives in the http context. Directives that
# Debian already sets at http level (e.g. `gzip on;`) must NOT be repeated at
# the top level of this file ("directive is duplicate") - that is why gzip is
# configured inside the server block below.
# =============================================================================


# -----------------------------------------------------------------------------
# Upstreams = named groups of backend servers.
# -----------------------------------------------------------------------------
# `keepalive N` keeps up to N idle connections per worker process open to the
# upstream and reuses them, instead of doing a TCP handshake for every single
# request. It only works together with `proxy_http_version 1.1` and an empty
# Connection header (both set in the 443 server below).
#
# The names are prefixed with "bugsquash_" because upstream names are global
# to the whole nginx instance - another site on this server could also have
# an upstream called "backend".
upstream bugsquash_backend {
    server 127.0.0.1:3000;      # Express API container (published on loopback)
    keepalive 16;
}

upstream bugsquash_frontend {
    server 127.0.0.1:8080;      # nginx-unprivileged container serving the Vite build
    keepalive 16;
}

# -----------------------------------------------------------------------------
# WebSocket-safe "Connection" header.
# -----------------------------------------------------------------------------
# Connection is a HOP-BY-HOP header: nginx does not forward the client's value.
#   - Normal request  ($http_upgrade empty) -> send `Connection: ""` so the
#     upstream keepalive connection is REUSED (no "Connection: close").
#   - WebSocket       ($http_upgrade = "websocket") -> send `Connection: upgrade`
#     so the protocol switch reaches the app.
# The game does not use WebSockets today; this makes the proxy future-proof.
map $http_upgrade $bugsquash_connection_upgrade {
    default upgrade;
    ''      '';
}


# =============================================================================
# Port 80 (plain HTTP): ACME challenges + redirect everything else to HTTPS
# =============================================================================
server {
    listen 80;
    listen [::]:80;                     # IPv6 (only matters if you add an AAAA record)
    server_name devops.gulfheight.com;

    access_log /var/log/nginx/devops.gulfheight.com.access.log;
    error_log  /var/log/nginx/devops.gulfheight.com.error.log warn;

    # Let's Encrypt HTTP-01 challenge: the CA fetches
    #   http://devops.gulfheight.com/.well-known/acme-challenge/<token>
    # and the file must be served over plain HTTP - so this location must NOT
    # redirect. `^~` means: if this prefix matches, stop looking (regex
    # locations are not even checked). Used by `certbot --webroot`; the
    # `certbot --nginx` authenticator injects its own temporary location.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Everything else -> HTTPS. 301 = permanent: browsers remember it.
    # The host name is spelled out instead of using $host, so a request with a
    # forged Host header can never turn this into an open redirect.
    location / {
        return 301 https://devops.gulfheight.com$request_uri;
    }
}


# =============================================================================
# Port 443 (HTTPS): the real site
# =============================================================================
server {
    # nginx >= 1.25.1 (Debian 13 "trixie" ships 1.26): HTTP/2 is enabled with
    # a separate `http2 on;` directive.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # Debian 12 "bookworm" ships nginx 1.22, which does not know `http2 on;`.
    # There, delete the `http2 on;` line and use instead:
    #   listen 443 ssl http2;
    #   listen [::]:443 ssl http2;

    server_name devops.gulfheight.com;

    # Do not advertise the exact nginx version in error pages / Server header.
    server_tokens off;

    access_log /var/log/nginx/devops.gulfheight.com.access.log;
    error_log  /var/log/nginx/devops.gulfheight.com.error.log warn;

    # ---- TLS ------------------------------------------------------------------
    # Written by certbot. `live/` contains SYMLINKS to the newest files in
    # `archive/`; renewal just repoints the symlinks, so this config never
    # changes - nginx only needs a reload to pick up the new certificate.
    ssl_certificate     /etc/letsencrypt/live/devops.gulfheight.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devops.gulfheight.com/privkey.pem;
    # certbot's maintained defaults: TLS 1.2 + 1.3 only, modern ciphers,
    # session cache. Created by the certbot nginx plugin on its first run.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # No `ssl_stapling`: Let's Encrypt shut down its OCSP service in 2025, so
    # there is nothing to staple (nginx would only log warnings).

    # ---- Request limits & timeouts -------------------------------------------
    # The API only accepts tiny JSON bodies ({username,password} / {score}) and
    # Express itself answers 413 above 10 kB. This edge limit rejects anything
    # over 1 MB with 413 before it even reaches a container.
    client_max_body_size 1m;
    client_body_timeout  15s;           # slow-loris protection: client must keep sending
    client_header_timeout 15s;
    keepalive_timeout    65s;           # idle client connections (browser <-> nginx)

    # ---- Compression ------------------------------------------------------------
    # text/html is always compressed once gzip is on (listing it causes a warning).
    gzip on;
    gzip_vary on;                       # add "Vary: Accept-Encoding" for caches
    gzip_proxied any;                   # also compress responses coming from upstreams
    gzip_comp_level 5;                  # good ratio without burning CPU
    gzip_min_length 256;                # tiny responses are not worth it
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # ---- Security headers ---------------------------------------------------------
    # HSTS: "for the next year, only ever talk HTTPS to this host" - the browser
    # upgrades http:// links itself, so the port-80 redirect is not even hit and
    # SSL-stripping attacks stop working. It can only be set by the TLS
    # terminator, which is why it lives HERE. Tip: while experimenting, start
    # with max-age=300 - a mistake with a 1-year value is cached by browsers.
    # (includeSubDomains covers *.devops.gulfheight.com only, not gulfheight.com.)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # `always` = also on 4xx/5xx responses (by default only on 2xx/3xx).

    # The backend (helmet) and the frontend container may send some of the
    # same headers. Two different X-Frame-Options values in one response are
    # treated as invalid by browsers, so hide the upstream copies and let this
    # edge proxy be the single owner of these headers. Content-Security-Policy
    # is deliberately left to the app: only the app knows which scripts and
    # styles it loads.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Powered-By;

    # ---- Proxy settings (inherited by every location below) ----------------------
    # INHERITANCE GOTCHA: proxy_set_header and add_header are inherited from the
    # server level ONLY IF the location defines none of its own. Adding a single
    # proxy_set_header inside a location silently drops ALL of these. So: define
    # them once here, and do not add any inside the locations.
    proxy_http_version 1.1;                       # required for keepalive + WebSockets

    proxy_set_header Host              $host;     # the app sees the real host name
    proxy_set_header X-Real-IP         $remote_addr;
    # Appends the client IP to any X-Forwarded-For it already sent. Express is
    # configured with trust proxy = loopback/private ranges, so req.ip becomes
    # the right-most UNTRUSTED address = the real client, even if the client
    # tried to spoof the header. Rate limiting depends on this!
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # The backend only sees plain HTTP; this tells it the browser used HTTPS
    # (req.secure / req.protocol in Express, which matters for Secure cookies).
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $bugsquash_connection_upgrade;

    # Timeouts towards the containers. Over loopback a healthy container accepts
    # a connection in microseconds, so 5s to connect is generous; while a deploy
    # recreates a container the connection is refused and the visitor gets an
    # immediate 502 instead of a hanging browser tab.
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;    # max time BETWEEN two reads from the upstream, not total time

    # ---- Real client IP behind Cloudflare (orange cloud) - DISABLED -------------
    # With Cloudflare's proxy ON, TCP connections come from Cloudflare edge
    # servers, so $remote_addr is a Cloudflare IP: logs and the backend's
    # per-IP login rate limit would lump all visitors together. Cloudflare puts
    # the visitor's address in the CF-Connecting-IP header. The realip module
    # replaces $remote_addr with it - but ONLY for connections that really come
    # from Cloudflare's ranges (set_real_ip_from). Without that restriction any
    # client could send a fake CF-Connecting-IP header directly to the server.
    # Keep this list up to date from https://www.cloudflare.com/ips/
    # Uncomment ONLY if the DNS record is proxied (see deploy/cloudflare-dns-guide.md).
    #
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;
    # set_real_ip_from 103.31.4.0/22;
    # set_real_ip_from 141.101.64.0/18;
    # set_real_ip_from 108.162.192.0/18;
    # set_real_ip_from 190.93.240.0/20;
    # set_real_ip_from 188.114.96.0/20;
    # set_real_ip_from 197.234.240.0/22;
    # set_real_ip_from 198.41.128.0/17;
    # set_real_ip_from 162.158.0.0/15;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 104.24.0.0/14;
    # set_real_ip_from 172.64.0.0/13;
    # set_real_ip_from 131.0.72.0/22;
    # set_real_ip_from 2400:cb00::/32;
    # set_real_ip_from 2606:4700::/32;
    # set_real_ip_from 2803:f800::/32;
    # set_real_ip_from 2405:b500::/32;
    # set_real_ip_from 2405:8100::/32;
    # set_real_ip_from 2a06:98c0::/29;
    # set_real_ip_from 2c0f:f248::/32;
    # real_ip_header CF-Connecting-IP;

    # ---- Routes ---------------------------------------------------------------------
    # ACME challenges can also arrive over HTTPS: when Cloudflare's proxy with
    # "Always Use HTTPS" is on, Let's Encrypt is redirected to https:// before it
    # reaches port 80. Serving the webroot here too keeps `certbot --webroot`
    # renewals working in that setup.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # API -> backend container. NOTE: proxy_pass WITHOUT a URI part (no trailing
    # slash) forwards the path unchanged: /api/health stays /api/health. With
    # `proxy_pass http://bugsquash_backend/;` nginx would REPLACE the matched
    # prefix "/api/" by "/", and the Express routes would no longer match.
    location /api/ {
        proxy_pass http://bugsquash_backend;
    }

    # Everything else -> frontend container (static HTML/JS/CSS built by Vite).
    # Caching headers for /assets/ (immutable) and HTML (no-cache) are set by
    # the frontend container's own nginx and passed through unchanged.
    location / {
        proxy_pass http://bugsquash_frontend;
    }
}
