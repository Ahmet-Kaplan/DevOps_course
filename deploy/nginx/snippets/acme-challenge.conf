# =============================================================================
# snippets/acme-challenge.conf - Let's Encrypt HTTP-01 challenge files
# -----------------------------------------------------------------------------
# Included in a `server { }` block (port 80 in both modes, and port 443).
#
# How HTTP-01 works: `./deploy/tls.sh issue` runs certbot in its own container
# (docker compose run --rm certbot certonly --webroot -w /var/www/certbot ...).
# certbot writes a random token file into the "certbot-webroot" volume, then
# asks Let's Encrypt to fetch
#     http://<DOMAIN>/.well-known/acme-challenge/<token>
# This proxy mounts the SAME volume read-only at /var/www/certbot and serves
# the file - proof that whoever asked for the certificate controls the server
# the domain points to. The two containers share files, never a process.
#
# `^~` = if this prefix matches, stop looking: regex locations are not even
# checked, and nothing (no redirect, no proxying) can shadow it.
#
# Why also on 443? With Cloudflare's proxy + "Always Use HTTPS", Let's Encrypt
# is redirected to https:// before it reaches port 80; serving the webroot on
# 443 too keeps renewals working in that setup.
# =============================================================================
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    # A missing token is a plain 404 - never fall through to the app.
    try_files $uri =404;
}
