# =============================================================================
# snippets/cloudflare-real-ip.conf - real visitor IP behind Cloudflare (DISABLED)
# -----------------------------------------------------------------------------
# Included in every `server { }` block. Everything below is commented out, so
# by default this file changes nothing.
#
# When to enable it: ONLY if the DNS record is PROXIED by Cloudflare ("orange
# cloud", cloudflare_proxied: true in ansible/group_vars/all.yml). Then TCP
# connections come from Cloudflare's edge servers, $remote_addr is a Cloudflare
# IP, and logs plus the backend's per-IP login rate limit would lump all
# visitors together. Cloudflare puts the visitor's address in the
# CF-Connecting-IP header; the realip module (compiled into the official nginx
# image) replaces $remote_addr with it - but ONLY for connections that really
# come from Cloudflare's ranges (set_real_ip_from). Without that restriction any
# client could send a fake CF-Connecting-IP header directly to the server.
#
# Keep the list in sync with https://www.cloudflare.com/ips/ . After editing:
# deploy (CI or ./deploy/deploy.sh) - it re-renders and gracefully reloads the
# proxy config - or `docker compose ... exec proxy nginx -s reload` by hand.
# See stages/stage-3-https.md ("Going deeper: Cloudflare's orange cloud").
# =============================================================================

