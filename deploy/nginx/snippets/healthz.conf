# =============================================================================
# snippets/healthz.conf - liveness endpoint of the edge proxy itself
# -----------------------------------------------------------------------------
# Included in the port-80 `server { }` of BOTH modes, and on port 443 in HTTPS
# mode. Used by:
#   * the container HEALTHCHECK in docker-compose.prod.yml
#     (wget http://127.0.0.1/healthz from inside the proxy container);
#   * deploy/deploy.sh and the ci-test workflow (curl http://127.0.0.1/healthz);
#   * deploy/tls.sh, over HTTPS, to prove the certificate works.
# It answers from nginx itself, without touching the app: "the proxy is up"
# and "the app is up" are different questions (the smoke tests ask both).
# In HTTPS mode it is one of the two things port 80 does NOT redirect - a
# healthcheck must not depend on TLS or on the certificate being valid.
# =============================================================================
location = /healthz {
    access_log off;             # probed every 15 s - keep the logs readable
    default_type text/plain;
    return 200 "ok";
}
