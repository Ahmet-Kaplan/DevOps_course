# =============================================================================
# snippets/http-level.conf - things that must live in nginx's `http { }` context
# -----------------------------------------------------------------------------
# Included ONCE, at the top of each site template (templates/*/site.conf.template).
# The official image's /etc/nginx/nginx.conf includes /etc/nginx/conf.d/*.conf
# INSIDE its `http { }` block, and the rendered template lands in conf.d/, so
# everything here is at http level. That image's nginx.conf already sets
# `sendfile`, `keepalive_timeout`, `access_log` and the `main` log format -
# repeating any of those here would be a "directive is duplicate" error.
#
# Snippets are NOT templates: ${DOMAIN} is not substituted in this directory.
# =============================================================================

# Do not advertise the exact nginx version in error pages / the Server header.
server_tokens off;

# -----------------------------------------------------------------------------
# Finding the other containers: Docker's embedded DNS server
# -----------------------------------------------------------------------------
# On a user-defined network every container has a DNS server at 127.0.0.11
# that answers for the Compose service names ("backend", "frontend").
#
# The problem with a plain `server backend:3000;`: nginx resolves the name ONCE,
# at startup. A deploy RECREATES the backend container, the new one usually gets
# a NEW IP address, and nginx would keep sending traffic to the old, dead IP
# until someone restarts the proxy.
#
# The fix (nginx >= 1.27.3, open source): `server ... resolve;` inside an
# upstream with a shared-memory `zone`. nginx then re-resolves the name in the
# background and updates the upstream on the fly:
#   valid=10s        re-resolve every 10 s, whatever TTL the DNS answer carries
#   ipv6=off         our Docker networks are IPv4-only; don't ask for AAAA
#   resolver_timeout when the name does NOT resolve (container stopped during a
#                    deploy), Docker's DNS answers SERVFAIL and nginx retries
#                    after resolver_timeout. The default is 30 s; measured on
#                    this stack, 5 s turns a possible 30 s of "502 Bad Gateway"
#                    after a backend recreate into at most a few seconds.
# Bonus: nginx starts fine even if "backend" does not exist yet (the edge keeps
# answering ACME challenges and /healthz while the app is down).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Upstream names are global to this nginx instance, hence the "bugsquash_"
# prefix (a second site could also have an upstream called "backend").
upstream bugsquash_backend {
    # Shared memory for the upstream's state, required by `resolve`
    # (all worker processes must see the same, updated address list).
    zone bugsquash_backend 64k;
    server backend:3000 resolve;      # Express API (Compose service "backend")
    # Keep up to 16 idle connections per worker open and REUSE them instead of
    # a TCP handshake per request. Needs `proxy_http_version 1.1` and an empty
    # Connection header - both set in snippets/proxy-to-app.conf.
    keepalive 16;
}

upstream bugsquash_frontend {
    zone bugsquash_frontend 64k;
    server frontend:8080 resolve;     # nginx-unprivileged serving the Vite build
    keepalive 16;
}

# -----------------------------------------------------------------------------
# WebSocket-safe "Connection" header
# -----------------------------------------------------------------------------
# Connection is a HOP-BY-HOP header: nginx does not forward the client's value.
#   - normal request  ($http_upgrade empty)  -> send `Connection: ""` so the
#     upstream keepalive connection is REUSED (no "Connection: close");
#   - WebSocket       ($http_upgrade set)    -> send `Connection: upgrade` so
#     the protocol switch reaches the app.
# The game does not use WebSockets today; this keeps the proxy future-proof.
map $http_upgrade $bugsquash_connection_upgrade {
    default upgrade;
    ''      '';
}
