# =============================================================================
# snippets/proxy-to-app.conf - route requests to the app containers
# -----------------------------------------------------------------------------
# Included at `server { }` level wherever the app is served (port 80 in
# HTTP-only mode, port 443 in HTTPS mode), so both modes route EXACTLY the same
# way - one copy of the rules, no drift between the two configs.
#
#   /api/  ->  upstream bugsquash_backend   (backend:3000, Express API)
#   /      ->  upstream bugsquash_frontend  (frontend:8080, static Vite build)
#
# /api/ goes straight to the backend instead of through the frontend
# container's nginx: one hop less, and the frontend container can be restarted
# without breaking the API. (The frontend nginx still proxies /api/ itself -
# handy when you `docker compose exec frontend wget -qO- 127.0.0.1:8080/api/health`.)
# =============================================================================

# ---- Request limits & timeouts ---------------------------------------------
# The API only accepts tiny JSON bodies ({username,password} / {score}) and
# Express itself answers 413 above 10 kB. This edge limit rejects anything over
# 1 MB with 413 before it even reaches a container.
client_max_body_size 1m;
client_body_timeout   15s;      # slow-loris protection: the client must keep sending
client_header_timeout 15s;

# ---- Compression -------------------------------------------------------------
# Mostly for API JSON: the frontend container already compresses its own files,
# and nginx never compresses a response that is already compressed.
# (text/html is always compressed once gzip is on; listing it causes a warning.)
gzip on;
gzip_vary on;                   # add "Vary: Accept-Encoding" for caches
gzip_proxied any;               # also compress responses coming from upstreams
gzip_comp_level 5;              # good ratio without burning CPU
gzip_min_length 256;            # tiny responses are not worth it
gzip_types text/plain text/css text/javascript application/javascript
           application/json application/xml image/svg+xml;

# ---- Proxy settings (inherited by every location below) ---------------------
# INHERITANCE GOTCHA: proxy_set_header is inherited from the server level ONLY
# IF the location defines none of its own. Adding one proxy_set_header inside a
# location silently drops ALL of these. Define them once, here.
proxy_http_version 1.1;                       # required for keepalive + WebSockets

proxy_set_header Host              $host;     # the app sees the real host name
proxy_set_header X-Real-IP         $remote_addr;
# Appends the client IP to any X-Forwarded-For it already sent. Express trusts
# proxies on private addresses (this container's IP on the "edge" network is
# one), so req.ip becomes the right-most UNTRUSTED address = the real client,
# even if the client tried to spoof the header. Rate limiting depends on this!
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# "https" on port 443, "http" on port 80. The backend only ever sees plain
# HTTP; this tells it what the BROWSER used (req.secure / req.protocol).
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $bugsquash_connection_upgrade;

# Inside one Docker network a healthy container accepts a connection in
# microseconds, so 5 s to connect is generous. While a deploy recreates a
# container the connection is refused and the visitor gets an immediate error
# instead of a hanging browser tab.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    60s;      # max time BETWEEN two reads, not the total time

# ---- Routes ------------------------------------------------------------------
# NOTE: proxy_pass WITHOUT a URI part (no trailing slash) forwards the path
# unchanged: /api/health stays /api/health. With `proxy_pass
# http://bugsquash_backend/;` nginx would REPLACE the matched prefix "/api/" by
# "/", and the Express routes would no longer match.
location /api/ {
    proxy_pass http://bugsquash_backend;

    # If nginx itself cannot reach the backend (container restarting during a
    # deploy, name not resolvable, timeout), answer in the API's own JSON error
    # format instead of nginx's HTML error page - the frontend's fetch() code
    # can display it. Errors the backend RETURNS (e.g. its own 503 from
    # /api/health when the database is down) pass through untouched, because
    # proxy_intercept_errors is off.
    error_page 502 503 504 = @api_unavailable;
}

location @api_unavailable {
    default_type application/json;
    return 503 '{"error":"The API is unavailable right now. Try again in a moment."}';
}

# Everything else -> frontend container (static HTML/JS/CSS built by Vite).
# Caching headers (/assets/ immutable, HTML no-cache) and the
# Content-Security-Policy are set by the frontend container's own nginx and
# passed through unchanged.
location / {
    proxy_pass http://bugsquash_frontend;
}
