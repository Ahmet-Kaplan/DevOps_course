# =============================================================================
# snippets/security-headers.conf - response headers owned by the edge proxy
# -----------------------------------------------------------------------------
# Included at `server { }` level wherever the app is served (port 80 in
# HTTP-only mode, port 443 in HTTPS mode).
#
# Strict-Transport-Security (HSTS) is NOT here: it only makes sense over HTTPS,
# so it lives in templates/https/site.conf.template, next to the certificate.
#
# INHERITANCE GOTCHA: `add_header` is inherited from the server level ONLY by
# locations that define no add_header of their own. Adding a single add_header
# inside a location silently drops ALL of these for that location. So: no
# location in this proxy uses add_header.
# `always` = also on 4xx/5xx responses (by default only on 2xx/3xx).
# =============================================================================
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# The backend (helmet) and the frontend container send some of the same
# headers. Two different X-Frame-Options values in one response are treated as
# invalid by browsers, so hide the upstream copies and let this edge proxy be
# the single owner of these headers. Content-Security-Policy is deliberately
# left to the app: only the app knows which scripts and styles it loads.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-Powered-By;
